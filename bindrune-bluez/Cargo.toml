[package]
name = "bindrune-bluez"
version = "0.6.5"
edition = "2024"
authors = ["kaii_lb <imkaiilb@gmail.com>", "Willem Vanhulle <willemvanhulle@gmail.com>"]

[dependencies]
async-stream = "0.3"
bluer = { version = "0.17.4", features = ["bluetoothd", "id"] }
bytesize = "2"
futures = "0.3.31"
libc = "0.2"
phf = { version = "0.13.1", features = ["macros"] }
pulseaudio = { version = "2.28.1", package = "libpulse-binding", features = ["pa_v15"] }
tokio = { version = "1.48.0", features = ["rt", "sync", "time", "macros", "net"] }
udev = { version = "0.9.3", features = ["hwdb"] }
uom = { version = "0.38", default-features = false, features = ["si", "std", "f32", "u32", "autoconvert"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt", "sync", "time", "macros", "test-util"] }
