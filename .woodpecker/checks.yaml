when:
  - repo: wvhulle/bindrune
    event: pull_request
  - repo: wvhulle/bindrune
    event: [push, manual]
    branch: main

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      max-jobs = 1
      cores = 2
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
  - &cache_writing_env
    <<: *nix_config
    CACHIX_AUTH_TOKEN:
      from_secret: cachix_auth_token
  - &on_trusted_events
    - event: [push, manual]
  - &on_pull_requests
    - event: pull_request

steps:
  - name: cargo-checks
    image: nixos/nix:latest
    depends_on: []
    when: *on_trusted_events
    environment: *cache_writing_env
    commands:
      - nix run --inputs-from . nixpkgs#cachix -- watch-exec wvhulle -- nix build --print-build-logs .#checks.x86_64-linux.tests .#checks.x86_64-linux.clippy

  - name: cargo-checks-pr
    image: nixos/nix:latest
    depends_on: []
    when: *on_pull_requests
    environment: *nix_config
    commands:
      - nix build --print-build-logs .#checks.x86_64-linux.tests .#checks.x86_64-linux.clippy

  - name: formatting
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix build --print-build-logs .#checks.x86_64-linux.formatting

  - name: background-service
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix build --print-build-logs .#checks.x86_64-linux.nixos-background-service
