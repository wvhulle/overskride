when:
  - repo: wvhulle/bindrune
    event: [push, manual]
    branch: main

depends_on:
  - checks

steps:
  - name: render-readme-screenshots
    image: nixos/nix:latest
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-substituters = https://wvhulle.cachix.org
        extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix run --inputs-from . nixpkgs#cachix -- watch-exec wvhulle -- nix build --print-build-logs .#readme-screenshots
      - cp -r --no-preserve=mode result/screenshots screenshots

  - name: push-screenshots-orphan-branch
    image: alpine/git
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - cd screenshots
      - git init --quiet --initial-branch screenshots
      - git add --all
      - git -c user.name=bindrune-ci -c user.email=willemvanhulle@protonmail.com commit --quiet --message "docs: README screenshots of $${CI_COMMIT_SHA}"
      - git remote add origin "https://wvhulle:$${CODEBERG_TOKEN}@codeberg.org/$${CI_REPO}.git"
      - published_tree=$(git fetch --quiet --depth 1 origin screenshots && git rev-parse 'FETCH_HEAD^{tree}' || true)
      - if [ "$published_tree" = "$(git rev-parse 'HEAD^{tree}')" ]; then echo "screenshots unchanged"; else git push --force origin screenshots; fi
