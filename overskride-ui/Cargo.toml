[package]
name = "overskride-ui"
version = "0.6.5"
edition = "2024"
authors = ["kaii_lb <imkaiilb@gmail.com"]

[[bin]]
name = "overskride"
path = "src/main.rs"

[dependencies]
futures = "0.3.31"
overskride-bluetooth = { path = "../overskride-bluetooth" }
relm4 = { version = "0.11", features = ["libadwaita", "gnome_47"] }
tokio = { version = "1.48.0", features = ["time"] }

[build-dependencies]
glib-build-tools = "0.22"
